name: qurb_app
description: "Qurb Islamic Prayer Times, Quran, Hadith & Guide App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1
  timezone: ^0.9.4
  syncfusion_flutter_pdfviewer: 30.2.7
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  package_info_plus: ^8.0.0
  pdfx:
  sensors_plus: ^4.0.2
  connectivity_plus: ^6.0.3
  location: ^6.0.2

  url_launcher: any
  path: any
  webview_flutter_android: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/web/icons/icon-1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2A1C11"
  adaptive_icon_foreground: "assets/web/icons/icon-1024.png"

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/web/icons/
    - assets/web/images/
    - assets/web/fonts/
    - assets/web/data/
    - assets/fonts/
    - assets/data/
    - assets/audio/

  fonts:
    - family: Al Mushaf
      fonts:
        - asset: assets/fonts/DigitalKhattIndoPak.otf
